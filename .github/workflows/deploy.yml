name: Deploy to GitHub Pages

# GitHub Pages for this repo is configured with the legacy "deploy from a
# branch" source, serving dirsol.com from the gh-pages branch. So this workflow
# builds the site and pushes the result to gh-pages, rather than using
# actions/deploy-pages (which only works when the Pages source is set to
# "GitHub Actions").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: dirsol.com
          commit_message: "Deploy ${{ github.sha }}"
